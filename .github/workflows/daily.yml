# Розміщується в публічному репозиторії даних як .github/workflows/daily.yml
# Щодня завантажує з data.gov.ua:
#   1) «Список справ призначених до розгляду» -> s/<суд>_<рік>.json + учасники p/<суд>_<рік>.json (split.py)
#   1б) «Стан розгляду справ» -> доповнює учасників і стадію в p/ (split_status.py)
#   1в) Індекс сторін для моніторингу за ПІБ або назвою -> n/<хеш слова>.json (split_names.py)
#   2) ЄДРСР за поточний і два попередні роки -> d/<суд>_<рік>_<0..3>.json + dicts.json (split_docs.py)
#   3) «Єдиний реєстр боржників» (Мін'юст) -> b/<хеш ПІБ>.json + b/dicts.json (split_erb.py)
# і публікує результат у гілку `data` (одна версія, без історії).
name: daily

on:
  push:
    branches: [main]
    paths: [split.py, split_docs.py, split_status.py, split_erb.py, split_names.py, .github/workflows/daily.yml]
  schedule:
    - cron: '20 4 * * *'   # 07:20 за Києвом (ДСА оновлює набори вночі й зранку)
    - cron: '20 13 * * *'  # 16:20 за Києвом, запасний запуск
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API: https://data.gov.ua/api/3/action
    steps:
      - uses: actions/checkout@v4

      - name: Попередня публікація (для накопичення учасників)
        run: |
          if git clone -q --depth 1 --filter=blob:none --no-checkout -b data "https://github.com/${{ github.repository }}" prev; then
            (cd prev && git sparse-checkout set p && git checkout -q data)
          else
            mkdir -p prev
          fi
          echo "prev parties files: $(ls prev/p 2>/dev/null | wc -l)"

      - name: Засідання
        run: |
          META=$(curl -sS --retry 3 -m 60 "$API/resource_show?id=98d6ba0d-1c18-4835-ae68-bfc0af724bfa")
          URL=$(echo "$META" | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['url'])")
          MOD=$(echo "$META" | python3 -c "import sys,json;print(json.load(sys.stdin)['result'].get('last_modified') or '')")
          echo "MOD=$MOD" >> "$GITHUB_ENV"
          curl -sS --retry 3 -m 900 -o f.csv "$URL"
          R=$(python3 split.py f.csv out "$MOD" prev)
          echo "::notice::$R"
          rm -rf f.csv prev

      - name: Учасники зі «Стану розгляду справ»
        continue-on-error: true
        run: |
          curl -sS --retry 3 -m 60 "$API/package_show?id=0ad60ea9-b029-456d-abc0-8c77a99b205c" -o st.json
          URL=$(python3 -c "import json;rs=[r for r in json.load(open('st.json'))['result']['resources'] if r['url'].endswith('.zip')];rs.sort(key=lambda r: r.get('last_modified') or r.get('created') or '');print(rs[-1]['url'] if rs else '')")
          echo "status archive: $URL"
          [ -n "$URL" ] && curl -sS --retry 3 -m 1800 -o st.zip "$URL" && R=$(python3 split_status.py out st.zip) && echo "::notice::$R"
          rm -f st.zip st.json

      - name: Індекс сторін (моніторинг за ПІБ або назвою)
        continue-on-error: true
        run: |
          if R=$(python3 split_names.py out 2>names.err); then
            echo "::notice::$R"
          else
            # збій не має стирати дані: лишаємо останню вдалу копію
            echo "::warning::Індекс сторін не оновлено: $R $(tail -c 300 names.err | tr '\n' ' ')"
            rm -rf out/n
            if git clone -q --depth 1 --filter=blob:none --no-checkout -b data "https://github.com/${{ github.repository }}" prevn; then
              (cd prevn && git sparse-checkout set n && git checkout -q data) || true
              if [ -d prevn/n ]; then
                cp -r prevn/n out/n
                python3 - <<'PY'
          import json
          prev = json.load(open('prevn/meta.json'))
          m = json.load(open('out/meta.json'))
          for k in ('names_cases', 'names_words', 'names_generated'):
              if k in prev:
                  m[k] = prev[k]
          json.dump(m, open('out/meta.json', 'w'), ensure_ascii=False, indent=1)
          PY
              fi
            fi
          fi
          rm -rf names.err prevn

      - name: Знайти архіви ЄДРСР
        run: |
          curl -sS --retry 3 -m 60 -G "$API/package_search" \
            --data-urlencode "q=Єдиний державний реєстр судових рішень" \
            --data-urlencode "fq=organization:derzhavna-sudova-administratsiia-ukrayiny" \
            --data-urlencode "rows=100" -o search.json
          python3 - <<'PY'
          import json, datetime
          y = datetime.date.today().year
          want = {str(y - 2), str(y - 1), str(y)}
          found = {}
          for p in json.load(open('search.json'))['result']['results']:
              for r in p.get('resources', []):
                  u = r.get('url', '')
                  for yy in want:
                      if u.endswith(f'edrsr_data_{yy}.zip'):
                          found[yy] = u
          with open('archives.txt', 'w') as f:
              for yy in sorted(found):
                  f.write(f'{yy} {found[yy]}\n')
          print(found)
          if len(found) < 2:
              raise SystemExit('Не знайдено архіви ЄДРСР')
          PY
          echo "::notice::$(tr '\n' ' ' < archives.txt)"

      - name: Документи ЄДРСР
        run: |
          while read y u; do curl -sS --retry 3 -m 1800 -o "e$y.zip" "$u"; done < archives.txt
          ls -l e*.zip
          R=$(python3 split_docs.py out e*.zip)
          echo "::notice::$R"
          rm e*.zip
          python3 - <<'PY'
          import json, datetime
          m = json.load(open('out/meta.json'))
          m['docs_years'] = [l.split()[0] for l in open('archives.txt')]
          m['docs_generated'] = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds')
          json.dump(m, open('out/meta.json', 'w'), ensure_ascii=False, indent=1)
          PY

      - name: Реєстр боржників (виконавчі провадження)
        continue-on-error: true
        run: |
          URL=$(curl -fsS --retry 3 -m 60 "$API/package_show?id=783b9b50-faba-4cc9-a393-60485e395b1d" | python3 -c "import sys,json;rs=[r for r in json.load(sys.stdin)['result']['resources'] if r['url'].lower().endswith('.zip')];rs.sort(key=lambda r: r.get('last_modified') or r.get('created') or '');print(rs[-1]['url'] if rs else '')" 2>erb.err) || URL=""
          echo "erb archive: $URL"
          R=""
          if [ -n "$URL" ] && curl -fsS -L --retry 3 -m 1800 -o erb.zip "$URL" 2>>erb.err && R=$(python3 split_erb.py out erb.zip 2>>erb.err); then
            echo "::notice::$R"
          else
            # збій не має стирати дані: лишаємо останню вдалу копію, а причина видна в анотації запуску
            echo "::warning::Реєстр боржників не оновлено: $R $(tail -c 300 erb.err | tr '\n' ' ')"
            rm -rf out/b out/_erb_tmp
            if git clone -q --depth 1 --filter=blob:none --no-checkout -b data "https://github.com/${{ github.repository }}" prevb; then
              (cd prevb && git sparse-checkout set b && git checkout -q data) || true
              if [ -d prevb/b ]; then
                cp -r prevb/b out/b
                python3 - <<'PY'
          import json
          prev = json.load(open('prevb/meta.json'))
          m = json.load(open('out/meta.json'))
          for k in ('erb_rows', 'erb_people', 'erb_generated'):
              if k in prev:
                  m[k] = prev[k]
          m['erb_stale'] = True
          json.dump(m, open('out/meta.json', 'w'), ensure_ascii=False, indent=1)
          PY
              fi
            fi
          fi
          rm -rf erb.zip erb.err prevb out/_erb_tmp

      - name: Опублікувати в гілку data
        run: |
          cd out
          git init -q -b data
          git config user.name "sudovi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          # GitHub приймає до 2 ГБ за один push: вантажимо частинами в тимчасову гілку,
          # а data перемикаємо останнім кроком, тож застосунок не бачить неповних даних
          push() {
            for i in 1 2 3; do
              if R=$(git push -f "$REMOTE" "$1" 2>&1); then return 0; fi
              echo "спроба $i: $R"
              sleep 30
            done
            echo "::error::Не вдалося опублікувати: $(echo "$R" | tail -c 400 | tr '\n' ' ')"
            return 1
          }
          git add d
          git commit -qm "Документи ЄДРСР"
          push data:refs/heads/data-next
          git add -A
          git commit -qm "Дані ДСА від $MOD"
          push data:refs/heads/data-next
          push data:refs/heads/data
          git push "$REMOTE" --delete data-next
